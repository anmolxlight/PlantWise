<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herbal Remedy Assistant</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* Global Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #61AA78; /* Subtle green-blue background */
            color: #333;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            position: relative; /* For positioning the toggle button */
        }

        /* Container for the Form */
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        /* Form Heading */
        h1 {
            color: #00796b;
            margin-bottom: 20px;
            font-size: 2.2em;
            font-weight: 600;
        }

        /* Label */
        label {
            font-size: 1.1em;
            color: #555;
            display: block;
            margin-bottom: 10px;
        }

        /* Textarea for Symptoms */
        textarea {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border-radius: 6px;
            border: 2px solid #ccc;
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
            resize: none;
            min-height: 120px;
        }

        textarea:focus {
            border-color: #00796b;
            outline: none;
        }

        /* Button Styling */
        button {
            padding: 12px 25px;
            background-color: #00796b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #004d40;
            transform: translateY(-2px);
        }

        /* Loading Animation */
        .loading {
            display: none;
            font-size: 1.1em;
            color: #00796b;
            margin-top: 20px;
        }

        /* Response Box Styling */
        .response {
            margin-top: 20px;
            padding: 20px;
            background-color: #e8f5e9;
            border-left: 5px solid #4caf50;
            display: none;
            border-radius: 4px;
            text-align: left;
            line-height: 1.6;
            font-size: 1em;
        }

        .response h4 {
            color: #00695c;
            font-size: 1.4em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .response p {
            margin-bottom: 12px;
            color: #333;
        }

        .response ul {
            list-style-type: disc;
            margin-left: 20px;
            margin-bottom: 12px;
        }

        .response li {
            margin-bottom: 8px;
            color: #333;
        }

        .response strong {
            color: #00695c;
            font-weight: 600;
        }

        /* Animation */
        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Dark Mode Toggle Button Styling */
        #dark-mode-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 8px 16px;
            background-color: #004d40;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background-color 0.3s ease;
            z-index: 1000; /* Ensure it's above other elements */
        }

        #dark-mode-toggle:hover {
            background-color: #00332a;
        }

        /* Dark Mode Styles */
        body.dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }

        .dark-mode .container {
            background-color: #1e1e1e;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .dark-mode h1 {
            color: #64b5f6;
        }

        .dark-mode label {
            color: #b0b0b0;
        }

        .dark-mode textarea {
            background-color: #2c2c2c;
            color: #e0e0e0;
            border-color: #555;
        }

        .dark-mode textarea:focus {
            border-color: #64b5f6;
        }

        .dark-mode button#submit-btn {
            background-color: #1976d2;
        }

        .dark-mode button#submit-btn:hover {
            background-color: #1565c0;
        }

        .dark-mode #dark-mode-toggle {
            background-color: #555;
        }

        .dark-mode #dark-mode-toggle:hover {
            background-color: #444;
        }

        .dark-mode .response {
            background-color: #2c2c2c;
            border-left-color: #64b5f6;
            color: #e0e0e0;
        }

        .dark-mode .response h4 {
            color: #64b5f6;
        }

        .dark-mode .response p,
        .dark-mode .response li {
            color: #e0e0e0;
        }

        .dark-mode .response strong {
            color: #90caf9;
        }

        /* Responsive Design */
        @media only screen and (max-width: 768px) {
            body {
                padding: 20px;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            label {
                font-size: 1em;
            }

            textarea {
                font-size: 15px;
                min-height: 100px;
            }

            button {
                width: 100%;
                padding: 15px;
                font-size: 1em;
            }

            .response {
                padding: 15px;
                font-size: 0.95em;
            }

            .response h4 {
                font-size: 1.2em;
            }

            #dark-mode-toggle {
                top: 10px;
                right: 10px;
                padding: 7px 14px;
                font-size: 0.85em;
            }
        }

        @media only screen and (max-width: 480px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.6em;
            }

            textarea {
                font-size: 14px;
                min-height: 80px;
            }

            button {
                padding: 12px;
                font-size: 0.95em;
            }

            .response {
                padding: 10px;
                font-size: 0.9em;
            }

            .response h4 {
                font-size: 1.1em;
            }

            #dark-mode-toggle {
                top: 8px;
                right: 8px;
                padding: 6px 12px;
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <button id="dark-mode-toggle">Dark Mode</button>
    <div class="container">
        <h1>Herbal Remedy Assistant</h1>
        <label for="symptoms">Enter your symptoms (comma-separated):</label>
        <textarea id="symptoms" placeholder="e.g., headache, fatigue, cough"></textarea>
        <button id="submit-btn">Get Remedy</button>
        <div class="loading">Processing your symptoms...</div>
        <div id="response" class="response"></div>
    </div>

    <script>
        $(document).ready(function() {
            const darkModeToggle = $('#dark-mode-toggle');
            const body = $('body');

            // Function to apply theme based on preference
            function applyTheme(theme) {
                if (theme === 'dark') {
                    body.addClass('dark-mode');
                    darkModeToggle.text('Light Mode');
                } else {
                    body.removeClass('dark-mode');
                    darkModeToggle.text('Dark Mode');
                }
            }

            // Check localStorage for saved theme preference
            let currentTheme = localStorage.getItem('theme');

            // If no saved preference, check prefers-color-scheme
            if (!currentTheme) {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    currentTheme = 'dark';
                } else {
                    currentTheme = 'light';
                }
            }
            
            applyTheme(currentTheme);

            darkModeToggle.on('click', function() {
                body.toggleClass('dark-mode');
                if (body.hasClass('dark-mode')) {
                    localStorage.setItem('theme', 'dark');
                    darkModeToggle.text('Light Mode');
                } else {
                    localStorage.setItem('theme', 'light');
                    darkModeToggle.text('Dark Mode');
                }
            });

            // Listen for changes in system preference
            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
                    const newColorScheme = event.matches ? 'dark' : 'light';
                    localStorage.setItem('theme', newColorScheme);
                    applyTheme(newColorScheme);
                });
            }

            $('#submit-btn').on('click', function() {
                const symptoms = $('#symptoms').val().trim();

                // Clear previous response and show loading
                $('#response').hide();
                $('.loading').show();

                if (symptoms === '') {
                    alert("Please enter symptoms.");
                    $('.loading').hide();
                    return;
                }

                // Send the symptoms to the Flask server
                $.ajax({
                    url: 'https://plantwisebackend.onrender.com/get_remedy',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ symptoms: symptoms }),
                    success: function(response) {
                        $('.loading').hide();
                        $('#response').html(formatResponse(response.response)).fadeIn().addClass('fade-in');
                    },
                    error: function(err) {
                        $('.loading').hide();
                        alert("An error occurred. Please try again.");
                    }
                });
            });

            function formatResponse(rawText) {
                let htmlOutput = '';
                const lines = rawText.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);

                const sectionKeywords = {
                    diseases: ["potential diseases", "health conditions", "possible conditions"],
                    remedies: ["herbal medicines", "herbal remedies", "plant-based remedies", "suggestions", "recommendations"],
                    avoid: ["things to avoid", "avoid", "precautions", "be careful with", "important considerations"]
                };

                if (lines.length < 3 && !lines.some(line => sectionKeywords.remedies.some(kw => line.toLowerCase().includes(kw)) || sectionKeywords.avoid.some(kw => line.toLowerCase().includes(kw)))) {
                    return lines.map(line => `<p>${line}</p>`).join('');
                }
                
                let currentSectionType = null;
                let sectionContentAccumulator = [];

                function processAccumulatedSection(type, contentLines) {
                    if (contentLines.length === 0) return '';
                    
                    let sectionHtml = '';
                    let title = '';
                    let actualContentLines = [...contentLines];

                    const firstLineLower = actualContentLines[0].toLowerCase();
                    let titleTakenFromFirstLine = false;

                    if (type) {
                        for (const keyType in sectionKeywords) {
                            if (sectionKeywords[keyType].some(kw => firstLineLower.startsWith(kw))) {
                                title = actualContentLines.shift().replace(/:$/, '');
                                titleTakenFromFirstLine = true;
                                break;
                            }
                        }
                        if (!titleTakenFromFirstLine) {
                            title = type.charAt(0).toUpperCase() + type.slice(1);
                        }
                    } else if (actualContentLines.length > 0) {
                        if (actualContentLines[0].length < 50 && actualContentLines[0].endsWith(':')) {
                            title = actualContentLines.shift().replace(/:$/, '');
                        }
                    }

                    if (title) {
                        sectionHtml += `<h4>${title.charAt(0).toUpperCase() + title.slice(1)}</h4>`;
                    }

                    let listItems = [];
                    let paragraphs = [];

                    for (let i = 0; i < actualContentLines.length; i++) {
                        let line = actualContentLines[i];
                        if (line.match(/^(\*|-|\d+\.?)\s+/)) {
                            if (paragraphs.length > 0) {
                                sectionHtml += `<p>${paragraphs.join(' ')}</p>`;
                                paragraphs = [];
                            }
                            listItems.push(`<li>${line.replace(/^(\*|-|\d+\.?)\s+/, '')}</li>`);
                        } else if (line.length > 0) {
                            if (listItems.length > 0) {
                                sectionHtml += `<ul>${listItems.join('')}</ul>`;
                                listItems = [];
                            }
                            paragraphs.push(line);
                        }
                    }

                    if (listItems.length > 0) {
                        sectionHtml += `<ul>${listItems.join('')}</ul>`;
                    }
                    if (paragraphs.length > 0) {
                        sectionHtml += `<p>${paragraphs.join(' ')}</p>`;
                    }
                    return sectionHtml;
                }

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    const lineLowerCase = line.toLowerCase();
                    let isNewSectionHeader = false;

                    for (const type in sectionKeywords) {
                        if (sectionKeywords[type].some(keyword => lineLowerCase.startsWith(keyword))) {
                            if (sectionContentAccumulator.length > 0) {
                                htmlOutput += processAccumulatedSection(currentSectionType, sectionContentAccumulator);
                            }
                            currentSectionType = type;
                            sectionContentAccumulator = [line];
                            isNewSectionHeader = true;
                            break;
                        }
                    }

                    if (!isNewSectionHeader) {
                        if (!currentSectionType && sectionContentAccumulator.length === 0 && i < 2) {
                            if (line.length < 50 && line.endsWith(':') && lines.length > i+1 && lines[i+1].match(/^(\*|-|\d+\.?)\s+/)) {
                                if (sectionContentAccumulator.length > 0) {
                                    htmlOutput += processAccumulatedSection(null, sectionContentAccumulator);
                                    sectionContentAccumulator = [];
                                }
                                currentSectionType = line.replace(/:$/, '');
                                sectionContentAccumulator.push(line);
                            } else {
                                sectionContentAccumulator.push(line);
                            }
                        } else {
                            sectionContentAccumulator.push(line);
                        }
                    }
                }

                if (sectionContentAccumulator.length > 0) {
                    htmlOutput += processAccumulatedSection(currentSectionType, sectionContentAccumulator);
                }

                if (htmlOutput.trim() === '' && rawText.trim().length > 0) {
                    return `<p>${rawText.replace(/(?:\r\n|\r|\n)+/g, '<br>')}</p>`;
                }
                if (htmlOutput.trim() === '') {
                    return '<p>No specific recommendations found based on the input.</p>';
                }

                return htmlOutput;
            }
        });
    </script>
</body>
</html>
